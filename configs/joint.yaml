# Joint training on the tabletop, confined-shelf and multi-level shelf training sets (one unified domain), two seeds.
#   python scripts/train.py --config configs/joint.yaml --seed 1
#   python scripts/eval.py  --config configs/joint.yaml --seed 1 --checkpoint <run directory>
# Training values are the logged values of the released runs (paper: the hyperparameter table of the appendix
# "Training Details").
# Reported checkpoint: the final weights at the 24 h walltime (not shipped: the run directory of the training run).

env:
  CONFINED_CHECKER: honest
  SHELF_ACCESS_CHECKER: v2

train_env:
  CKPT_PERIOD: 5                 # also save every 5th validation pass (no effect on the final weights)

walltime: 24h                    # the reported runs ended at the 24 h walltime (final weights)

train:
  data_path: joint
  train_dir: train
  val_dir: validation
  domain_file: domain.pddl
  num_workers: 16
  pool_workers: 16
  embedding_size: 32
  num_layers: 30
  pooling_mode: mask
  search_budget: 4096
  search_batching: 64
  action_cost: 0.5
  max_infeasible_retries: 2
  val_max_infeasible_retries: 2
  budget_growth_threshold: 5
  budget_max_multiplier: 4        # budget cap 4 x 4096 = 16384
  budget_growth_increment: 1024
  budget_growth_mode: additive
  dead_end_reward: -50
  lr_readout: 3.7e-4
  lr_gnn: 1.0e-4
  max_grad_norm: 1.0
  max_updates_per_iter: 10
  buffer_size: 20
  worker_time_limit_s: 60
  random_exploration: 0.2
  policy_loss_weight: 0.1         # auxiliary policy cross-entropy (paper: Aux. CE); it trains only the GNN trunk
  wandb_project: joint

eval:
  checkpoint: checkpoints/joint/seed_{seed}
  out: outputs/joint/seed_{seed}
  default: gbfs
  protocols:
    gbfs:
      help: the three environments' evaluation sets in the unified domain (set names as reap.eval.joint_report reads them)
      runner: protocol
      # the reported evaluations: 180 s per feasibility check, one thread per worker process
      env: {FILTER_TIMEOUT_S: 180, OMP_NUM_THREADS: 1, MKL_NUM_THREADS: 1, OPENBLAS_NUM_THREADS: 1}
      args:
        label: "seed_{seed}"
        workers: 8
        max_budget: 16384
        runs:
          - {script: joint_protocol, domain: u-confined, data: joint,
             specs: ["ID:eval_confined:300:id", "OOD:eval_confined_nonmonotone_10:100:eval_confined_nonmonotone_10",
                     "OOD:eval_confined_nonmonotone_12:100:eval_confined_nonmonotone_12",
                     "OOD:eval_confined_nonmonotone_14:100:eval_confined_nonmonotone_14",
                     "OOD:eval_confined_nonmonotone_16:100:eval_confined_nonmonotone_16"]}
          - {script: joint_protocol, domain: u-shelf, data: joint, specs: ["OOD:eval_multilevel_shelf_ood:300:eval_ood"]}
          - {script: joint_protocol, domain: u-shelf, data: joint, subdir: eval_multilevel_shelf,
             specs: ["ID:eval_multilevel_shelf:300:eval_multilevel_shelf"]}
          - {script: joint_protocol, domain: u-tabletop, data: joint, workers: 1,
             specs: ["OOD:eval_tabletop/obj10:300:obj10", "OOD:eval_tabletop/obj12:300:obj12",
                     "OOD:eval_tabletop/obj14:300:obj14", "OOD:eval_tabletop/obj16:300:obj16",
                     "OOD:eval_tabletop/obj18:300:obj18", "OOD:eval_tabletop/obj20:300:obj20",
                     "OOD:eval_tabletop/obj22:300:obj22", "OOD:eval_tabletop/obj24:300:obj24",
                     "OOD:eval_tabletop/obj10_plan3:300:obj10_plan3", "OOD:eval_tabletop/obj12_plan3:300:obj12_plan3",
                     "OOD:eval_tabletop/obj14_plan5:300:obj14_plan5", "OOD:eval_tabletop/obj16_plan5:300:obj16_plan5",
                     "OOD:eval_tabletop/obj10_plan5_biased2:300:obj10_plan5_biased2",
                     "OOD:eval_tabletop/obj12_plan7_biased3:300:obj12_plan7_biased3",
                     "OOD:eval_tabletop/obj14_plan9_biased3:300:obj14_plan9_biased3"]}
