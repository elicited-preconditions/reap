# Confined shelf: Table 2 and the non-monotone table of the appendix "Environments", grasp-library checker.
#   python scripts/train.py --config configs/confined.yaml --seed 1
#   python scripts/eval.py  --config configs/confined.yaml --seed 1
# Training values are the logged values of the released runs (paper: the hyperparameter table of the appendix
# "Training Details"). Reported checkpoint: the final weights (the run directory itself, not a checkpoint/
# save).

env:
  CONFINED_CHECKER: honest
  SHELF_ACCESS_CHECKER: v2

walltime: 24h                    # the reported runs ended at the 24 h walltime (final weights)

train:
  data_path: confined
  train_dir: train
  val_dir: validation
  domain_file: domain.pddl
  num_workers: 16
  pool_workers: 16
  embedding_size: 64
  num_layers: 30
  pooling_mode: mask
  search_budget: 4096
  search_batching: 64
  action_cost: 0.5
  max_infeasible_retries: 2
  val_max_infeasible_retries: 2
  budget_growth_threshold: 5
  budget_max_multiplier: 4        # budget cap 4 x 4096 = 16384
  budget_growth_increment: 1024
  budget_growth_mode: additive
  dead_end_reward: -50
  lr_readout: 3.7e-4
  lr_gnn: 1.0e-4
  max_grad_norm: 1.0
  max_updates_per_iter: 10
  buffer_size: 20
  worker_time_limit_s: 60
  random_exploration: 0.2
  policy_loss_weight: 0.1         # auxiliary policy cross-entropy (paper: Aux. CE); it trains only the GNN trunk
  wandb_project: confined

eval:
  checkpoint: checkpoints/confined/seed_{seed}
  out: outputs/confined/seed_{seed}
  default: gbfs
  protocols:
    gbfs:
      help: ID 300 s, non-monotone 10 / 12 / 14 / 16 objects 100 s (set names as reap.eval.table2_shelves reads them)
      runner: protocol
      # the reported evaluations: 180 s per feasibility check, one thread per worker process
      env: {FILTER_TIMEOUT_S: 180, OMP_NUM_THREADS: 1, MKL_NUM_THREADS: 1, OPENBLAS_NUM_THREADS: 1}
      args:
        label: "seed_{seed}"
        workers: 8
        max_budget: 16384
        runs:
          - script: eval_protocol
            domain: confined-shelf
            data: confined
            specs: ["ID:eval:300:validation", "OOD:eval_nonmonotone_10:100:eval_nonmonotone_10",
                    "OOD:eval_nonmonotone_12:100:eval_nonmonotone_12",
                    "OOD:eval_nonmonotone_14:100:eval_nonmonotone_14",
                    "OOD:eval_nonmonotone_16:100:eval_nonmonotone_16"]
